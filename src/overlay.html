<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background-color: transparent;
            font-family: monospace;
            user-select: none;
            overflow: hidden;
            margin: 0;
        }

        .main-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 20px;
        }

        .container {
            position: relative;
        }

        .key {
            background: #333;
            color: #ccc;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
        }

        .key.active {
            background: #ff6900;
            color: #000;
        }

        .mouse {
            display: grid;
            grid-template-columns: 35px 20px 35px;
            grid-template-rows: 15px 20px 15px 50px;
            gap: 4px;
            margin-left: 20px;
        }

        .mouse-key {
            background: #333;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            box-sizing: border-box;
        }

        .mouse-key.active {
            background: #ff6900;
            color: #000;
        }

        .l-click {
            grid-column: 1;
            grid-row: 1 / 4;
        }

        .r-click {
            grid-column: 3;
            grid-row: 1 / 4;
        }

        .scroll-up {
            grid-column: 2;
            grid-row: 1;
        }

        .m-click {
            grid-column: 2;
            grid-row: 2;
        }

        .scroll-down {
            grid-column: 2;
            grid-row: 3;
        }

        .mouse-body {
            grid-column: 1 / 4;
            grid-row: 4;
            background: #1a1a1a;
            box-sizing: border-box;
        }

        .side-btn-container {
            position: absolute;
            bottom: 0px;
            left: 0px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .side-btn {
            width: 10px;
            height: 25px;
            font-size: 8px;
            writing-mode: vertical-rl;
        }
    </style>
</head>

<body>
    <div class="main-wrapper">
        <div id="keyboard-container" class="container"></div>

        <div class="container" style="padding-top: 15px;">
            <div class="side-btn-container">
                <div id="key-276" class="mouse-key side-btn">S2</div>
                <div id="key-275" class="mouse-key side-btn">S1</div>
            </div>
            <div class="mouse">
                <div id="key-272" class="mouse-key l-click">L</div>
                <div id="key-273" class="mouse-key r-click">R</div>
                <div id="key-SCROLL_UP" class="mouse-key scroll-up">^</div>
                <div id="key-274" class="mouse-key m-click">M</div>
                <div id="key-SCROLL_DOWN" class="mouse-key scroll-down">v</div>
                <div class="mouse-body"></div>
            </div>
        </div>
    </div>

    <script>
        const layout = [
            { c: 1, l: 'Esc', x: 0, y: 0 },
            { c: 59, l: 'F1', x: 2, y: 0 }, { c: 60, l: 'F2', x: 3, y: 0 }, { c: 61, l: 'F3', x: 4, y: 0 }, { c: 62, l: 'F4', x: 5, y: 0 },
            { c: 63, l: 'F5', x: 6.5, y: 0 }, { c: 64, l: 'F6', x: 7.5, y: 0 }, { c: 65, l: 'F7', x: 8.5, y: 0 }, { c: 66, l: 'F8', x: 9.5, y: 0 },
            { c: 67, l: 'F9', x: 11, y: 0 }, { c: 68, l: 'F10', x: 12, y: 0 }, { c: 87, l: 'F11', x: 13, y: 0 }, { c: 88, l: 'F12', x: 14, y: 0 },
            { c: 99, l: 'Prt', x: 15.25, y: 0 }, { c: 70, l: 'Scr', x: 16.25, y: 0 }, { c: 119, l: 'Pau', x: 17.25, y: 0 },
            { c: 41, l: '`', x: 0, y: 1.5 }, { c: 2, l: '1', x: 1, y: 1.5 }, { c: 3, l: '2', x: 2, y: 1.5 }, { c: 4, l: '3', x: 3, y: 1.5 }, { c: 5, l: '4', x: 4, y: 1.5 }, { c: 6, l: '5', x: 5, y: 1.5 }, { c: 7, l: '6', x: 6, y: 1.5 }, { c: 8, l: '7', x: 7, y: 1.5 }, { c: 9, l: '8', x: 8, y: 1.5 }, { c: 10, l: '9', x: 9, y: 1.5 }, { c: 11, l: '0', x: 10, y: 1.5 }, { c: 12, l: '-', x: 11, y: 1.5 }, { c: 13, l: '=', x: 12, y: 1.5 }, { c: 14, l: 'Back', x: 13, y: 1.5, w: 2 },
            { c: 110, l: 'Ins', x: 15.25, y: 1.5 }, { c: 102, l: 'Hom', x: 16.25, y: 1.5 }, { c: 104, l: 'PgU', x: 17.25, y: 1.5 },
            { c: 69, l: 'Num', x: 18.5, y: 1.5 }, { c: 98, l: '/', x: 19.5, y: 1.5 }, { c: 55, l: '*', x: 20.5, y: 1.5 }, { c: 74, l: '-', x: 21.5, y: 1.5 },
            { c: 15, l: 'Tab', x: 0, y: 2.5, w: 1.5 }, { c: 16, l: 'Q', x: 1.5, y: 2.5 }, { c: 17, l: 'W', x: 2.5, y: 2.5 }, { c: 18, l: 'E', x: 3.5, y: 2.5 }, { c: 19, l: 'R', x: 4.5, y: 2.5 }, { c: 20, l: 'T', x: 5.5, y: 2.5 }, { c: 21, l: 'Y', x: 6.5, y: 2.5 }, { c: 22, l: 'U', x: 7.5, y: 2.5 }, { c: 23, l: 'I', x: 8.5, y: 2.5 }, { c: 24, l: 'O', x: 9.5, y: 2.5 }, { c: 25, l: 'P', x: 10.5, y: 2.5 }, { c: 26, l: '[', x: 11.5, y: 2.5 }, { c: 27, l: ']', x: 12.5, y: 2.5 }, { c: 43, l: '\\', x: 13.5, y: 2.5, w: 1.5 },
            { c: 111, l: 'Del', x: 15.25, y: 2.5 }, { c: 107, l: 'End', x: 16.25, y: 2.5 }, { c: 109, l: 'PgD', x: 17.25, y: 2.5 },
            { c: 71, l: '7', x: 18.5, y: 2.5 }, { c: 72, l: '8', x: 19.5, y: 2.5 }, { c: 73, l: '9', x: 20.5, y: 2.5 }, { c: 78, l: '+', x: 21.5, y: 2.5, h: 2 },
            { c: 58, l: 'Caps', x: 0, y: 3.5, w: 1.75 }, { c: 30, l: 'A', x: 1.75, y: 3.5 }, { c: 31, l: 'S', x: 2.75, y: 3.5 }, { c: 32, l: 'D', x: 3.75, y: 3.5 }, { c: 33, l: 'F', x: 4.75, y: 3.5 }, { c: 34, l: 'G', x: 5.75, y: 3.5 }, { c: 35, l: 'H', x: 6.75, y: 3.5 }, { c: 36, l: 'J', x: 7.75, y: 3.5 }, { c: 37, l: 'K', x: 8.75, y: 3.5 }, { c: 38, l: 'L', x: 9.75, y: 3.5 }, { c: 39, l: ';', x: 10.75, y: 3.5 }, { c: 40, l: "'", x: 11.75, y: 3.5 }, { c: 28, l: 'Enter', x: 12.75, y: 3.5, w: 2.25 },
            { c: 75, l: '4', x: 18.5, y: 3.5 }, { c: 76, l: '5', x: 19.5, y: 3.5 }, { c: 77, l: '6', x: 20.5, y: 3.5 },
            { c: 42, l: 'Shift', x: 0, y: 4.5, w: 2.25 }, { c: 44, l: 'Z', x: 2.25, y: 4.5 }, { c: 45, l: 'X', x: 3.25, y: 4.5 }, { c: 46, l: 'C', x: 4.25, y: 4.5 }, { c: 47, l: 'V', x: 5.25, y: 4.5 }, { c: 48, l: 'B', x: 6.25, y: 4.5 }, { c: 49, l: 'N', x: 7.25, y: 4.5 }, { c: 50, l: 'M', x: 8.25, y: 4.5 }, { c: 51, l: ',', x: 9.25, y: 4.5 }, { c: 52, l: '.', x: 10.25, y: 4.5 }, { c: 53, l: '/', x: 11.25, y: 4.5 }, { c: 54, l: 'Shift', x: 12.25, y: 4.5, w: 2.75 },
            { c: 103, l: '^', x: 16.25, y: 4.5 },
            { c: 79, l: '1', x: 18.5, y: 4.5 }, { c: 80, l: '2', x: 19.5, y: 4.5 }, { c: 81, l: '3', x: 20.5, y: 4.5 }, { c: 96, l: 'Ent', x: 21.5, y: 4.5, h: 2 },
            { c: 29, l: 'Ctrl', x: 0, y: 5.5, w: 1.25 }, { c: 125, l: 'Win', x: 1.25, y: 5.5, w: 1.25 }, { c: 56, l: 'Alt', x: 2.5, y: 5.5, w: 1.25 }, { c: 57, l: 'Space', x: 3.75, y: 5.5, w: 6.25 }, { c: 100, l: 'Alt', x: 10, y: 5.5, w: 1.25 }, { c: 464, l: 'Fn', x: 11.25, y: 5.5, w: 1.25 }, { c: 127, l: 'Menu', x: 12.5, y: 5.5, w: 1.25 }, { c: 97, l: 'Ctrl', x: 13.75, y: 5.5, w: 1.25 },
            { c: 105, l: '<', x: 15.25, y: 5.5 }, { c: 108, l: 'v', x: 16.25, y: 5.5 }, { c: 106, l: '>', x: 17.25, y: 5.5 },
            { c: 82, l: '0', x: 18.5, y: 5.5, w: 2 }, { c: 83, l: '.', x: 20.5, y: 5.5 }
        ];

        const container = document.getElementById('keyboard-container');
        const unitSize = 38;
        const gap = 4;

        let maxX = 0;
        let maxY = 0;

        layout.forEach(key => {
            const w = key.w || 1;
            const h = key.h || 1;

            if (key.x + w > maxX) maxX = key.x + w;
            if (key.y + h > maxY) maxY = key.y + h;

            const el = document.createElement('div');
            el.id = 'key-' + key.c;
            el.className = 'key';
            el.textContent = key.l;

            el.style.left = `calc(${key.x} * ${unitSize}px + ${key.x} * ${gap}px)`;
            el.style.top = `calc(${key.y} * ${unitSize}px + ${key.y} * ${gap}px)`;
            el.style.width = `calc(${w} * ${unitSize}px + ${w - 1} * ${gap}px)`;
            el.style.height = `calc(${h} * ${unitSize}px + ${h - 1} * ${gap}px)`;

            container.appendChild(el);
        });

        container.style.width = `calc(${maxX} * ${unitSize}px + ${maxX - 1} * ${gap}px)`;
        container.style.height = `calc(${maxY} * ${unitSize}px + ${maxY - 1} * ${gap}px)`;

        const ws = new WebSocket(`ws://${location.host}/ws`);
        let scrollUpTimeout, scrollDownTimeout;

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 1) {
                const el = document.getElementById('key-' + data.code);
                if (el) {
                    if (data.value === 1 || data.value === 2) el.classList.add('active');
                    else if (data.value === 0) el.classList.remove('active');
                }
            }
            else if (data.type === 2 && data.code === 8) {
                const isUp = data.value === 1;
                const el = document.getElementById(isUp ? 'key-SCROLL_UP' : 'key-SCROLL_DOWN');

                if (el) {
                    el.classList.add('active');

                    if (isUp) {
                        clearTimeout(scrollUpTimeout);
                        scrollUpTimeout = setTimeout(() => el.classList.remove('active'), 16);
                    } else {
                        clearTimeout(scrollDownTimeout);
                        scrollDownTimeout = setTimeout(() => el.classList.remove('active'), 16);
                    }
                }
            }
        };

        ws.onclose = () => setTimeout(() => location.reload(), 1000);
    </script>
</body>

</html>
